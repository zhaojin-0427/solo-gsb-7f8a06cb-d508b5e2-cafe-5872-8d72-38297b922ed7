services:
  static-publisher:
    build: .
    image: static-publisher:latest
    container_name: static-publisher
    ports:
      - "8080:8080"
    volumes:
      - static-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  static-data:
